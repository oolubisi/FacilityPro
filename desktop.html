<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1b2f" />
    <title>Facility Pro</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="desktop.css" />
    <script src="Core.js" defer></script>
    <script src="Login.js" defer></script>
    <script src="Modals-core.js" defer></script>
    <script src="Modals-forms.js" defer></script>
    <script src="pdf.js" defer></script>
    <script src="Records.js" defer></script>
    <script src="Reports.js" defer></script>
    <script src="desktop.js" defer></script>
  </head>
  <body class="desktop-shell">
    <div id="toast-container" role="status" aria-live="polite"></div>
    <div id="login-screen" class="login-screen" hidden></div>
    <div id="sync-status"><i class="fas fa-sync-alt fa-spin"></i> Syncing</div>
    <div id="global-loader" class="loader-overlay">
      <div class="loader-spinner"></div>
      <p class="loader-text">Loading...</p>
    </div>

    <div class="desktop-app">
      <aside class="sidebar">
        <div class="brand">
          <img id="desktop-logo" src="logo.png" alt="" />
          <span id="desktop-brand">Facility Pro</span>
        </div>

        <nav class="nav-section" aria-label="Primary">
          <button class="nav-item active" data-view="apartments">
            <i class="fas fa-building"></i><span>Apartments</span>
          </button>
          <button class="nav-item" data-view="assets">
            <i class="fas fa-screwdriver-wrench"></i><span>Assets</span>
          </button>
          <button class="nav-item" data-view="tickets">
            <i class="fas fa-clipboard-list"></i><span>Tickets</span>
          </button>
          <button class="nav-item" data-view="workorders">
            <i class="fas fa-file-invoice-dollar"></i><span>Work Orders</span>
          </button>
          <button class="nav-item" data-view="inventory">
            <i class="fas fa-boxes-stacked"></i><span>Inventory</span>
          </button>
          <button class="nav-item" data-view="vendors">
            <i class="fas fa-truck"></i><span>Vendors</span>
          </button>
          <button class="nav-item" data-view="accounts">
            <i class="fas fa-money-check-dollar"></i><span>Accounts</span>
          </button>
          <button class="nav-item" data-view="expenserequests">
            <i class="fas fa-receipt"></i><span>Expense Requests</span>
          </button>
          <button class="nav-item" data-view="cashexpenses">
            <i class="fas fa-hand-holding-dollar"></i><span>Cash Expenses</span>
          </button>
          <button class="nav-item" data-view="staff">
            <i class="fas fa-users"></i><span>Staff</span>
          </button>
          <button class="nav-item" data-view="utilities">
            <i class="fas fa-bolt"></i><span>Utilities & Plant</span>
          </button>
          <button class="nav-item" data-view="archived">
            <i class="fas fa-box-archive"></i><span>Archived</span>
          </button>
          <button id="desktop-servicecharge-nav" class="nav-item" data-view="servicecharge">
            <i class="fas fa-coins"></i><span>Service Charge</span>
          </button>
          <button class="nav-item" data-view="reports">
            <i class="fas fa-file-lines"></i><span>Reports</span>
          </button>
        </nav>

        <nav class="nav-section secondary" aria-label="Utilities">
          <button id="sync-now" class="nav-item muted">
            <i class="fas fa-rotate"></i><span>Sync Now</span>
          </button>
          <button id="refresh-now" class="nav-item muted">
            <i class="fas fa-database"></i><span>Refresh</span>
          </button>
          <div style="position:relative;">
            <button id="recent-windows-btn" class="nav-item muted" onclick="toggleRecentWindowsPanel()" style="width:100%;">
              <i class="fas fa-clone"></i><span>Recent Windows</span>
            </button>
            <div id="recent-windows-panel" class="recent-windows-panel">
              <div class="recent-windows-header">Recently Opened</div>
              <div id="recent-windows-list"></div>
            </div>
          </div>
          <button id="open-mobile" class="nav-item muted">
            <i class="fas fa-mobile-screen"></i><span>Mobile View</span>
          </button>
          <button id="desktop-settings-nav" class="nav-item muted" data-view="settings">
            <i class="fas fa-gear"></i><span>Settings</span>
          </button>
          <button class="nav-item muted" data-view="help">
            <i class="fas fa-circle-question"></i><span>Help</span>
          </button>
          <button id="desktop-logout-btn" class="nav-item muted" data-action="log-out">
            <i class="fas fa-right-from-bracket"></i><span id="desktop-logout-label">Log Out</span>
          </button>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="search-wrap">
            <i class="fas fa-magnifying-glass"></i>
            <input
              id="global-search"
              type="search"
              autocomplete="off"
              placeholder="Search unit, asset, vendor or work order..."
            />
          </div>
          <button id="new-record" class="primary-action">
            <i class="fas fa-plus"></i><span>New</span>
          </button>
        </header>

        <div id="overdue-digest" class="overdue-digest" hidden></div>

        <section class="overview-grid" aria-label="Overview">
          <button class="metric" data-view="apartments">
            <span>Apartments</span><strong id="metric-apartments">0</strong>
          </button>
          <button class="metric" data-view="assets">
            <span>Assets</span><strong id="metric-assets">0</strong>
          </button>
          <button class="metric danger" data-view="tickets">
            <span>Open Tickets</span><strong id="metric-tickets">0</strong>
          </button>
          <button class="metric warning" data-view="workorders">
            <span>Pending Work Orders</span><strong id="metric-workorders">0</strong>
          </button>
        </section>

        <section class="content-head">
          <div>
            <p id="section-kicker">Operations</p>
            <h1 id="section-title">Apartments</h1>
          </div>
          <div style="display:flex; align-items:center; gap:14px;">
            <button id="print-pending-prs" onclick="printAllPendingPaymentRequests()" style="display:none; background:#101820; color:#fff; border:0; border-radius:10px; padding:10px 16px; font-weight:900; font-size:13px; cursor:pointer;"><i class="fas fa-print"></i> Print Pending PRs</button>
            <button id="new-plant-log-btn" onclick="openModal('generator')" style="display:none; background:#fd7e14; color:#fff; border:0; border-radius:10px; padding:10px 16px; font-weight:900; font-size:13px; cursor:pointer;"><i class="fas fa-charging-station"></i> New Plant Log</button>
            <button id="export-csv-btn" data-action="export-csv" style="display:none; background:var(--green); color:#fff; border:0; border-radius:10px; padding:10px 16px; font-weight:900; font-size:13px; cursor:pointer;"><i class="fas fa-file-csv"></i> Export CSV</button>
            <button id="toggle-select-mode" onclick="toggleSelectMode()" class="select-mode-toggle" style="display:none;"><i class="fas fa-check-double"></i> Select</button>
            <div id="record-count" class="record-count">0 records</div>
          </div>
        </section>

        <section id="card-grid" class="card-grid" aria-live="polite"></section>
        <section id="detail-panel" class="detail-panel" hidden></section>
      </main>
    </div>

    <div id="report-print-container"></div>

    <div
      class="modal-overlay"
      id="modalOverlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal">
        <div class="modal-header">
          <h3 id="modalTitle">Form</h3>
          <div class="modal-header-actions">
            <button
              class="action-btn"
              style="background: #444; margin-left: 100px;"
              onclick="closeModal()"
            >
              Cancel
            </button>
            <button class="action-btn" id="modalSubmit">Save</button>
          </div>
        </div>
        <div id="modalBody" style="margin-top: 15px"></div>
      </div>
    </div>

    <div id="bulk-action-bar" class="bulk-action-bar" hidden></div>

    <footer id="status-bar" class="status-bar">
      <div class="status-bar-item" id="statusbar-connection">
        <span class="status-dot"></span>
        <span id="statusbar-connection-text">Online</span>
      </div>
      <div class="status-bar-sep"></div>
      <div class="status-bar-item" id="statusbar-sync">
        <i class="fas fa-check-circle"></i>
        <span id="statusbar-sync-text">All changes synced</span>
      </div>
      <div class="status-bar-sep"></div>
      <div class="status-bar-item status-bar-message" id="statusbar-message">
        <span id="statusbar-message-text">Ready</span>
      </div>
    </footer>
  </body>
</html>
